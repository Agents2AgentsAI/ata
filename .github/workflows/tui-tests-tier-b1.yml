name: tui-tests-tier-b1

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "codex-rs/**"
      - ".github/workflows/tui-tests-tier-b1.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/**"
      - ".github/workflows/tui-tests-tier-b1.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  tier-b1:
    name: Tier B1 scenarios (TUI via tmux, no LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0

      - name: Cache cargo registry + target
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: tui-tests-tier-b1-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            tui-tests-tier-b1-${{ runner.os }}-
            tui-tests-tier-a-${{ runner.os }}-

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build ata
        run: cargo build -p codex-cli --bin ata

      - name: Bypass login + directory-trust prompts
        # No LLM calls in B1, so any non-empty key skips the welcome
        # login screen. The trust entry skips the per-directory prompt
        # so ata boots straight into the composer.
        run: |
          mkdir -p ~/.ata
          printf '{"OPENAI_API_KEY":"fake-tier-b1-key"}' > ~/.ata/auth.json
          cat > ~/.ata/config.toml <<EOF
          [projects."${{ github.workspace }}"]
          trust_level = "trusted"

          [projects."${{ github.workspace }}/codex-rs"]
          trust_level = "trusted"
          EOF

      - name: Run Tier B1 scenarios
        env:
          ATA_BIN: ${{ github.workspace }}/codex-rs/target/debug/ata
        run: ./tests/tui/run-tier-b1.sh
