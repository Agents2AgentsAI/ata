name: tui-tests-tier-a

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "codex-rs/**"
      - ".github/workflows/tui-tests-tier-a.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/**"
      - ".github/workflows/tui-tests-tier-a.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  tier-a:
    name: Tier A scenarios (no LLM, no TUI)
    runs-on: ubuntu-24.04
    # Tier A is shell-only (no TUI, no LLM). Full suite finishes in
    # ~60 seconds locally; cargo build dominates total wall-clock at
    # ~3-5 min on a cold cache. 15 min is comfortable headroom.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0

      - name: Cache cargo registry + target
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: tui-tests-tier-a-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            tui-tests-tier-a-${{ runner.os }}-

      - name: Build ata
        run: cargo build -p codex-cli --bin ata

      - name: Run Tier A scenarios
        env:
          ATA_BIN: ${{ github.workspace }}/codex-rs/target/debug/ata
          # TR-061 D-L hit api.zotero.org against a dedicated dummy group
          # (id 6566036, "tim test"). When the secret is unset (e.g. PRs
          # from forks), D-L self-skip and the rest of tier A still runs.
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: ./tests/tui/run-tier-a.sh
