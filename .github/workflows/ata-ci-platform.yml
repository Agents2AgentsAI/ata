name: ata-ci-platform

# ATA-specific platform CI using RunsOn runners.
# Kept separate from upstream rust-ci.yml / rust-ci-full.yml to avoid merge conflicts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "codex-rs/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/runs-on.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/runs-on.yml"
  workflow_dispatch:
    inputs:
      macos_only:
        description: "Run only the macOS XLarge matrix (used by the /ci-macos comment trigger)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# CI builds in debug (dev) for faster signal.

jobs:
  # --- Detect what changed and plan the platform matrix ----------------------
  setup:
    name: Detect changes & plan matrix
    runs-on: ubuntu-24.04
    outputs:
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      run_other: ${{ steps.plan.outputs.run_other }}
      lint_matrix: ${{ steps.plan.outputs.lint_matrix }}
      tests_matrix: ${{ steps.plan.outputs.tests_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On push / manual runs, default to running everything
            files=("codex-rs/force" ".github/force")
          fi

          codex=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

      # macOS XLarge runners are GitHub-billed and ~17x the cost of the RunsOn
      # Linux fleet, so they are NOT included in the per-push PR matrix. They
      # run only after merge to main (push) or on explicit demand: a manual
      # workflow_dispatch, or a `/ci-macos` PR comment (see
      # ata-ci-macos-comment.yml) which dispatches this workflow with
      # macos_only=true against the PR branch.
      - name: Plan platform matrix
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MACOS_ONLY: ${{ github.event.inputs.macos_only }}
          RID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          run_macos=false
          run_other=true
          case "$EVENT" in
            push)
              run_macos=true ;;
            workflow_dispatch)
              run_macos=true
              [[ "${MACOS_ONLY:-false}" == "true" ]] && run_other=false ;;
            *)
              # pull_request and everything else: never provision macOS.
              run_macos=false ;;
          esac

          linux_x64="runs-on=${RID}/runner=ci-linux-x64/extras=s3-cache/volume=160gb/spot=false"
          linux_arm64="runs-on=${RID}/runner=ci-linux-arm64/extras=s3-cache/volume=160gb/spot=false/cpu=16/ram=64"
          windows_x64="runs-on=${RID}/runner=ci-windows-x64/volume=160gb/cpu=16/ram=64/spot=false"

          lint_other=$(jq -cn --arg lx "$linux_x64" --arg la "$linux_arm64" --arg wx "$windows_x64" '[
            {runner:"ubuntu-x64",  target:"x86_64-unknown-linux-musl", profile:"dev",     runs_on:$lx},
            {runner:"ubuntu-x64",  target:"x86_64-unknown-linux-gnu",  profile:"dev",     runs_on:$lx},
            {runner:"ubuntu-arm64",target:"aarch64-unknown-linux-musl",profile:"dev",     runs_on:$la},
            {runner:"ubuntu-arm64",target:"aarch64-unknown-linux-gnu", profile:"dev",     runs_on:$la},
            {runner:"windows-x64", target:"x86_64-pc-windows-msvc",    profile:"dev",     runs_on:$wx},
            {runner:"ubuntu-x64",  target:"x86_64-unknown-linux-musl", profile:"release", runs_on:$lx},
            {runner:"ubuntu-arm64",target:"aarch64-unknown-linux-musl",profile:"release", runs_on:$la},
            {runner:"windows-x64", target:"x86_64-pc-windows-msvc",    profile:"release", runs_on:$wx}
          ]')
          lint_macos=$(jq -cn '[
            {runner:"macos-15-xlarge",target:"aarch64-apple-darwin",profile:"dev"},
            {runner:"macos-15-xlarge",target:"x86_64-apple-darwin", profile:"dev"},
            {runner:"macos-15-xlarge",target:"aarch64-apple-darwin",profile:"release"}
          ]')
          tests_other=$(jq -cn --arg lx "$linux_x64" --arg la "$linux_arm64" --arg wx "$windows_x64" '[
            {runner:"ubuntu-x64",  target:"x86_64-unknown-linux-gnu", profile:"dev",runs_on:$lx},
            {runner:"ubuntu-arm64",target:"aarch64-unknown-linux-gnu",profile:"dev",runs_on:$la},
            {runner:"windows-x64", target:"x86_64-pc-windows-msvc",   profile:"dev",runs_on:$wx}
          ]')
          tests_macos=$(jq -cn '[
            {runner:"macos-15-xlarge",target:"aarch64-apple-darwin",profile:"dev"}
          ]')

          build() {
            local other="$1" macos="$2" acc='[]'
            [[ "$run_other" == "true" ]] && acc=$(jq -c ". + $other" <<<"$acc")
            [[ "$run_macos" == "true" ]] && acc=$(jq -c ". + $macos" <<<"$acc")
            jq -c '{include: .}' <<<"$acc"
          }

          {
            echo "run_macos=$run_macos"
            echo "run_other=$run_other"
            echo "lint_matrix=$(build "$lint_other" "$lint_macos")"
            echo "tests_matrix=$(build "$tests_other" "$tests_macos")"
          } >> "$GITHUB_OUTPUT"

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: 45
    needs: setup
    # Skip expensive matrix jobs on draft PRs and when no relevant files changed.
    # The platform set (incl. whether macOS runs) is decided in `setup`.
    if: ${{ !github.event.pull_request.draft && (needs.setup.outputs.run_macos == 'true' || needs.setup.outputs.run_other == 'true') && (needs.setup.outputs.codex == 'true' || needs.setup.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Speed up repeated builds across CI runs by caching compiled objects (non-Windows).
      USE_SCCACHE: ${{ startsWith(matrix.runner, 'windows') && 'false' || 'true' }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G
      # In rust-ci, representative release-profile checks use thin LTO for faster feedback.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.profile == 'release' && 'thin' || 'fat' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.lint_matrix) }}

    steps:
      - uses: actions/checkout@v6
      - name: Activate RunsOn
        if: ${{ contains(matrix.runs_on || '', 'runs-on=') }}
        uses: runs-on/action@v2
      - name: Set up MSVC dev environment
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            # libasound2-dev is required by `alsa-sys` (transitively pulled in by
            # `cpal`) when codex-tui builds the voice/audio_device modules.
            # libc++-20-dev / libc++abi-20-dev provide the newer libcxx ABI the
            # prebuilt v8 `ptrcomp_sandbox_release` archive references (e.g.
            # std::__1::__hash_memory). Fall back to the default 18 if 20 isn't
            # available on this runner.
            packages=(pkg-config libcap-dev libasound2-dev)
            if [[ "${{ matrix.target }}" == 'x86_64-unknown-linux-musl' || "${{ matrix.target }}" == 'aarch64-unknown-linux-musl' ]]; then
              packages+=(libubsan1)
            fi
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}" libc++-20-dev libc++abi-20-dev; then
              llvm_lib_dir=""
              for candidate in /usr/lib/llvm-20/lib/x86_64-unknown-linux-gnu \
                               /usr/lib/llvm-20/lib/aarch64-unknown-linux-gnu \
                               /usr/lib/llvm-20/lib; do
                if [ -e "$candidate/libc++.so" ] || [ -e "$candidate/libc++.so.1" ]; then
                  llvm_lib_dir="$candidate"; break
                fi
              done
              if [ -n "$llvm_lib_dir" ]; then
                echo "LIBRARY_PATH=${llvm_lib_dir}" >> "$GITHUB_ENV"
                echo "LD_LIBRARY_PATH=${llvm_lib_dir}" >> "$GITHUB_ENV"
                echo "Selected libc++ dir: ${llvm_lib_dir}"
              fi
            else
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}" libc++-dev libc++abi-dev
            fi
          fi
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Explicit cache restore: split cargo home vs target, so we can
      # avoid caching the large target dir on the gnu-dev job.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      # Install and restore sccache cache
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Disable sccache wrapper (musl)
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Prepare APT cache directories (musl)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists
          sudo chown -R "$USER:$USER" /var/cache/apt /var/lib/apt/lists

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Restore APT cache (musl)
        id: cache_apt_restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install musl build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Configure rustc UBSan wrapper (musl host)
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Clear sanitizer flags (musl)
        shell: bash
        run: |
          set -euo pipefail
          # Clear global Rust flags so host/proc-macro builds don't pull in UBSan.
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          # Override any runner-level Cargo config rustflags as well.
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' }}
        name: Configure musl rusty_v8 artifact overrides
        # `denoland/rusty_v8` does not ship a musl prebuilt for any v8
        # version; the upstream Codex release republishes a plain `release`
        # musl variant.
        # All other targets fall back to the v8 build script's default
        # download from denoland. Neither archive enables
        # `v8_enable_sandbox`, which matches the
        # `[features] sandbox = ...` removal from `codex-v8-poc` and
        # `codex-code-mode` in this workspace — keeping the linked-V8
        # ABI consistent with the bindings the v8 crate generates.
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          archive="${base_url}/librusty_v8_release_${TARGET}.a.gz"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          binding_path="${binding_dir}/src_binding_release_${TARGET}.rs"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/src_binding_release_${TARGET}.rs" -o "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "$GITHUB_ENV"

      - if: ${{ contains(matrix.target, 'aarch64-unknown-linux') }}
        name: Cap build parallelism (ARM)
        shell: bash
        run: echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - if: ${{ runner.os == 'Windows' }}
        name: Cap build parallelism (Windows)
        shell: bash
        # Windows MSVC rustc memory usage compiling `codex-app-server`'s
        # `--all-features` ci-test test set spikes hard enough to OOM the
        # ci-windows-x64 runner even with `CARGO_BUILD_JOBS=4` (multiple
        # parallel rustc processes each fail their first ~2 MiB allocation,
        # which is the runner running out of physical RAM, not heap
        # fragmentation). Cap at 2 jobs — slower but reliably fits.
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      # macOS runners periodically lose connectivity to
      # chromium.googlesource.com mid-fetch, which makes the
      # `libwebrtc -> yuv-sys -> libyuv` submodule grab in
      # `codex-realtime-webrtc` (macOS-only) flake out cargo's own
      # 4-attempt retry. Pre-fetch with our own outer retry+backoff so
      # subsequent cargo invocations (chef cook, clippy, nextest) read
      # from a warm cache instead of re-racing the network.
      - name: Pre-fetch git dependencies (macOS, libwebrtc retry)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::cargo fetch attempt $attempt"
            if cargo fetch --target ${{ matrix.target }}; then
              echo "::endgroup::"
              echo "cargo fetch succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 5 ]; then
              SLEEP_S=$((30 * attempt))
              echo "Attempt $attempt failed; waiting ${SLEEP_S}s..."
              sleep $SLEEP_S
            fi
          done
          echo "cargo fetch failed after 5 attempts"
          exit 1

      - name: Install cargo-chef
        if: ${{ matrix.profile == 'release' }}
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-chef
          version: 0.1.71

      - name: Pre-warm dependency cache (cargo-chef)
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        # NOTE: cargo-chef replaces each workspace crate's source with an
        # empty stub in place, builds the registry/dep cache, and leaves the
        # stubs on disk. In the Docker pattern this is fine because the next
        # stage does `COPY . .` to restore real source on top. In this CI job
        # there is no such restore, so follow-up steps (clippy, tests) would
        # see the stubbed source. Cook without `--all-features` so we don't
        # pull in optional path deps that try to compile against the emptied
        # codex-rs sources.
        #   * We manually restore source with `git checkout` after cook so
        #     the subsequent `cargo clippy` step sees the real files.
        run: |
          set -euo pipefail
          RECIPE="${RUNNER_TEMP}/chef-recipe.json"
          cargo chef prepare --recipe-path "$RECIPE"
          cargo chef cook --recipe-path "$RECIPE" --target ${{ matrix.target }} --release

      - name: Restore workspace source after cargo-chef cook
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # cargo-chef leaves every workspace crate's src replaced with an empty
        # stub; restore the real source before the real clippy/test runs.
        run: git checkout -- codex-rs

      - name: cargo clippy
        run: cargo clippy --target ${{ matrix.target }} --all-features --tests --profile ${{ matrix.profile }} --timings -- -D warnings

      - name: Upload Cargo timings (clippy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ata-clippy-${{ matrix.target }}-${{ matrix.profile }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      # Save caches explicitly; make non-fatal so cache packaging
      # never fails the overall job. Only save when key wasn't hit.
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        working-directory: .
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        working-directory: .
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }} (${{ matrix.profile }})";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save APT cache (musl)
        if: always() && !cancelled() && (matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl') && steps.cache_apt_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

  tests:
    name: Tests — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    # 75 min: Linux/macOS finish in ~12-15 min so the extra budget costs
    # nothing there. Windows MSVC under nextest is materially slower (many
    # individual tests >30s; the agent::control + thread_manager suites
    # exercise heavy IO + process spawn), so a 45 min limit pushed Windows
    # to cancellation before all retries could complete. Widen to give
    # Windows headroom without changing per-test assertions.
    timeout-minutes: 75
    needs: setup
    if: ${{ !github.event.pull_request.draft && (needs.setup.outputs.run_macos == 'true' || needs.setup.outputs.run_other == 'true') && (needs.setup.outputs.codex == 'true' || needs.setup.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Speed up repeated builds across CI runs by caching compiled objects (non-Windows).
      USE_SCCACHE: ${{ startsWith(matrix.runner, 'windows') && 'false' || 'true' }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G
      # Windows default thread stack is 1 MB; rustc needs more for large --all-features test builds.
      RUST_MIN_STACK: "16777216"

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.tests_matrix) }}

    steps:
      - uses: actions/checkout@v6
      - name: Activate RunsOn
        if: ${{ contains(matrix.runs_on || '', 'runs-on=') }}
        uses: runs-on/action@v2
      - name: Set up MSVC dev environment
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Node.js for js_repl tests
        uses: actions/setup-node@v6
        with:
          node-version-file: codex-rs/node-version.txt
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            # libc++-20-dev / libc++abi-20-dev are needed because the v8 prebuilt
            # was built against newer libc++ and references symbols (e.g.
            # std::__1::__hash_memory) not present in Ubuntu noble's default
            # libc++-18.
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                pkg-config libcap-dev libasound2-dev bubblewrap \
                libc++-20-dev libc++abi-20-dev; then
              # libc++-20 ships under /usr/lib/llvm-20/lib (or the per-arch
              # subdir). Put it first on LIBRARY_PATH so `-lc++` picks the
              # newer libc++ over the system default libc++-18.
              llvm_lib_dir=""
              for candidate in /usr/lib/llvm-20/lib/x86_64-unknown-linux-gnu \
                               /usr/lib/llvm-20/lib/aarch64-unknown-linux-gnu \
                               /usr/lib/llvm-20/lib; do
                if [ -e "$candidate/libc++.so" ] || [ -e "$candidate/libc++.so.1" ]; then
                  llvm_lib_dir="$candidate"; break
                fi
              done
              if [ -n "$llvm_lib_dir" ]; then
                echo "LIBRARY_PATH=${llvm_lib_dir}" >> "$GITHUB_ENV"
                echo "LD_LIBRARY_PATH=${llvm_lib_dir}" >> "$GITHUB_ENV"
                echo "Selected libc++ dir: ${llvm_lib_dir}"
              fi
            else
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                pkg-config libcap-dev libasound2-dev bubblewrap libc++-dev libc++abi-dev
            fi
          fi
      # Some integration tests rely on DotSlash being installed.
      - name: Install DotSlash
        uses: facebook/install-dotslash@v2

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest
          version: 0.9.103

      - if: ${{ contains(matrix.target, 'aarch64-unknown-linux') }}
        name: Cap build parallelism (ARM)
        shell: bash
        run: echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - if: ${{ runner.os == 'Windows' }}
        name: Cap build parallelism (Windows)
        shell: bash
        # Windows MSVC rustc memory usage compiling `codex-app-server`'s
        # `--all-features` ci-test test set spikes hard enough to OOM the
        # ci-windows-x64 runner even with `CARGO_BUILD_JOBS=4` (multiple
        # parallel rustc processes each fail their first ~2 MiB allocation,
        # which is the runner running out of physical RAM, not heap
        # fragmentation). Cap at 2 jobs — slower but reliably fits.
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Required for bubblewrap to work on Linux CI runners.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ can additionally gate unprivileged user namespaces
          # behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Reduce Windows test debug info
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Avoid sporadic LINK LNK1318 PDB corruption failures when nextest
          # links many Windows test binaries in parallel.
          echo "CARGO_PROFILE_CI_TEST_DEBUG=0" >> "$GITHUB_ENV"

      # See matching step in the lint_build job — chromium.googlesource.com
      # flakes during the libwebrtc submodule grab on macOS. Pre-fetch with
      # our own retry so nextest's first attempt finds everything cached.
      - name: Pre-fetch git dependencies (macOS, libwebrtc retry)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::cargo fetch attempt $attempt"
            if cargo fetch --target ${{ matrix.target }}; then
              echo "::endgroup::"
              echo "cargo fetch succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 5 ]; then
              SLEEP_S=$((30 * attempt))
              echo "Attempt $attempt failed; waiting ${SLEEP_S}s..."
              sleep $SLEEP_S
            fi
          done
          echo "cargo fetch failed after 5 attempts"
          exit 1

      # `cargo nextest run` only builds tests + lib targets. The Windows
      # sandbox integration tests in `codex-core` stage the
      # `ata-windows-sandbox-setup` and `ata-command-runner` binaries
      # next to the test exe; those are `[[bin]]` targets in another crate
      # and nextest does not build them automatically. Pre-build them here
      # so `cargo_bin()` can locate them.
      - name: Build Windows sandbox helper bins for tests
        if: runner.os == 'Windows'
        run: cargo build --bins -p codex-windows-sandbox --target ${{ matrix.target }} --profile ci-test

      # The elevated Windows sandbox test
      # (`windows_elevated_enforces_exact_and_glob_deny_read_policy`) ends
      # up calling `CreateProcessWithLogonW`, which depends on the
      # Secondary Logon Service (`seclogon`). On the runs-on Windows
      # Server 2025 AMI that service ships set to `Manual / Stopped` for
      # hardening, so the API returns ERROR_ACCESS_DENIED (5). Start it
      # before tests run. Idempotent — no-op if already running.
      - name: Ensure Secondary Logon Service is running (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name seclogon -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host "seclogon service is not present on this runner image"
            exit 0
          }
          Write-Host "seclogon initial state: $($svc.Status) (StartType=$($svc.StartType))"
          if ($svc.StartType -eq 'Disabled') {
            Set-Service -Name seclogon -StartupType Manual
            Write-Host "seclogon StartType set to Manual"
          }
          if ($svc.Status -ne 'Running') {
            Start-Service -Name seclogon
            (Get-Service -Name seclogon).WaitForStatus('Running', '00:00:30')
            Write-Host "seclogon started"
          } else {
            Write-Host "seclogon already running"
          }
          Get-Service -Name seclogon | Format-List Name, Status, StartType

      - name: tests
        id: test
        run: cargo nextest run --all-features --no-fail-fast --target ${{ matrix.target }} --cargo-profile ci-test --timings
        env:
          RUST_BACKTRACE: 1
          NEXTEST_STATUS_LEVEL: leak

      - name: Upload Cargo timings (nextest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ata-nextest-${{ matrix.target }}-${{ matrix.profile }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        working-directory: .
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        working-directory: .
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }} (tests)";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. See logs for details."
          exit 1

  # --- Gatherer job ----------------------------------------------------------
  results:
    name: Platform CI results
    needs: [setup, lint_build, tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "lint   : ${{ needs.lint_build.result }}"
          echo "tests  : ${{ needs.tests.result }}"

          # Draft PRs intentionally skip expensive jobs.
          if [[ '${{ github.event.pull_request.draft }}' == 'true' ]]; then
            echo 'Draft PR -> expensive CI skipped.'
            exit 0
          fi

          # If nothing relevant changed, declare success.
          if [[ '${{ needs.setup.outputs.codex }}' != 'true' && '${{ needs.setup.outputs.workflows }}' != 'true' && '${{ github.event_name }}' != 'push' && '${{ github.event_name }}' != 'workflow_dispatch' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          [[ '${{ needs.lint_build.result }}' == 'success' ]] || { echo 'lint_build failed'; exit 1; }
          [[ '${{ needs.tests.result }}' == 'success' ]] || { echo 'tests failed'; exit 1; }

      - name: sccache summary note
        if: always()
        run: |
          echo "Per-job sccache stats are attached to each matrix job's Step Summary."
