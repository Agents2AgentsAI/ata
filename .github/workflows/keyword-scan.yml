name: keyword-scan

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  scan:
    name: Scan for prohibited keywords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for prohibited patterns
        shell: bash
        run: |
          set -euo pipefail
          failed=false

          patterns=(
            'sentry\.io/[0-9]+'
            'statsig\.com'
            'STATSIG_'
            'chatgpt\.com/backend'
            'CODEX_OPENAI_API_KEY'
          )

          for pattern in "${patterns[@]}"; do
            if grep -rEn "$pattern" --include='*.yml' --include='*.yaml' --include='*.py' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' . \
              | grep -v '.github/workflows/keyword-scan.yml'; then
              echo "::error::Found prohibited pattern: $pattern"
              failed=true
            fi
          done

          # Check for old repo references in workflow files specifically.
          # Allowlist:
          #  - keyword-scan.yml itself (the rule definitions match themselves).
          #  - The rusty_v8 prebuilt-archive URL: ATA does not host its own
          #    rusty_v8 builds, so the CI bootstrap legitimately downloads
          #    them from upstream openai/codex releases.
          if grep -rn 'openai/codex' .github/ \
            | grep -v '.github/workflows/keyword-scan.yml' \
            | grep -v 'github.com/openai/codex/releases/download/'; then
            echo "::error::Found old repo reference: openai/codex"
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            echo "Keyword scan failed. Please remove the prohibited patterns above."
            exit 1
          fi

          echo "Keyword scan passed."

      - name: Check release config for re-clobbered upstream identifiers
        shell: bash
        run: |
          set -euo pipefail
          # These files carry ATA-specific release customizations that upstream
          # `codex` merges have repeatedly clobbered with their `codex`-named
          # versions (compare the rust-v0.5.1 tag against HEAD). Fail here so the
          # regression is caught at the merge PR rather than at release time.
          release_files=(
            .github/workflows/rust-release.yml
            .github/workflows/rust-release-windows.yml
            .github/workflows/rust-release-zsh.yml
            .github/dotslash-config.json
            .github/dotslash-zsh-config.json
            codex-cli/scripts/build_npm_package.py
            codex-cli/scripts/install_native_deps.py
            scripts/stage_npm_packages.py
            scripts/install/install.sh
            scripts/install/install.ps1
          )
          existing=()
          for f in "${release_files[@]}"; do
            [[ -f "$f" ]] && existing+=("$f")
          done
          if [[ ${#existing[@]} -eq 0 ]]; then
            echo "No release config files found to check."
            exit 0
          fi

          failed=false
          forbidden=(
            'codex-runners'                # upstream self-hosted runner group (ATA uses runs-on.io)
            'codex-npm-'                   # upstream npm tarball names (ATA uses ata-npm-)
            'OpenAI.Codex'                 # winget identifier / Windows install dir
            '--package[[:space:]]+codex'   # ATA stages --package ata / ata-responses-api-proxy / ata-sdk
            'setup-rusty-v8-musl'          # nonexistent composite action (ATA inlines the override)
            'developers\.openai\.com'      # upstream Vercel deploy hook
          )
          for pattern in "${forbidden[@]}"; do
            if grep -EnH -- "$pattern" "${existing[@]}"; then
              echo "::error::Release config contains a re-clobbered upstream identifier matching: $pattern"
              failed=true
            fi
          done

          # `openai/codex` is allowed in these files ONLY on a `releases/download/`
          # URL — that's the upstream rusty_v8 prebuilt-archive fetch, which ATA
          # legitimately reuses (it does not host its own). Any other reference
          # (api.github.com/repos/openai/codex/..., @openai/codex, ...) is a leftover.
          if grep -EnH -- 'openai/codex' "${existing[@]}" | grep -v 'releases/download/'; then
            echo "::error::Release config references openai/codex outside the rusty_v8 archive download"
            failed=true
          fi

          # The release `build` job reuses CI's runs-on.io Linux pools (ci-linux-*)
          # but must NOT inherit CI's `extras=s3-cache`: on runs-on.io that extra
          # rewrites ACTIONS_RESULTS_URL to the local agent, which makes
          # `actions/upload-artifact`'s CreateArtifact fail ("Unexpected token 'O',
          # Original A... is not valid JSON") and also strands the bytes in the
          # runs-on S3 bucket where the GitHub-hosted publish job can't reach them.
          # Catch it here if someone re-copies a CI `runs_on:` string verbatim.
          if [[ -f .github/workflows/rust-release.yml ]] \
            && grep -En 'runs_on:.*extras=s3-cache' .github/workflows/rust-release.yml; then
            echo "::error::rust-release.yml has a runs_on string with extras=s3-cache — drop it (breaks artifact upload on the release path)."
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            echo "An upstream merge likely re-clobbered an ATA release file (or re-introduced a known release footgun)."
            echo "Diff the offending file against the rust-v0.5.1 tag and re-apply the ATA customization."
            exit 1
          fi
          echo "Release config check passed."
