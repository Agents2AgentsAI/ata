images:
  windows25-vstoolchain-x64:
    platform: "windows"
    arch: "x64"
    owner: "self"
    name: "runs-on-windows25-vstoolchain-x64-*"

runners:
  # --- CI (smaller, spot, cost-optimized) ---
  ci-linux-x64:
    image: ubuntu24-full-x64
    family: ["c7i-flex", "m7i-flex"]
    # Matched to ci-linux-arm64. The full test matrix (--all-features, 7000+
    # tests across 195 binaries) was silently killing the previous 4 vCPU /
    # 16 GB spot instances ~15-16 min into the `tests` step (step 20 would
    # have no conclusion, the job log would stop recording before the
    # nextest summary). 8 vCPU / 32 GB on-demand removes the OOM headroom
    # problem and the spot-preemption retry hole in one go.
    cpu: [8, 16]
    ram: [32, 64]
    spot: false
    retry: when-interrupted

  ci-linux-arm64:
    image: ubuntu24-full-arm64
    family: ["c7g", "m7g"]
    cpu: [8, 16]
    # Pin to the larger 64 GB variant. ATA's `--all-features` Tests step
    # compiles `codex-app-server`, `codex-tui`, `codex-core`, and several
    # extra crates (v8-poc impl, elevenlabs, realtime-webrtc, voice +
    # audio_device modules) on top of upstream, and the 32 GB tier was
    # repeatedly losing the runner mid-build with `runner has received
    # a shutdown signal`. 64 GB removes the OOM headroom problem.
    ram: [64]
    spot: false
    # Re-arm if the AWS instance is interrupted (rare but seen on c7g
    # spot fallbacks during long compiles).
    retry: when-interrupted

  ci-windows-x64:
    image: windows25-vstoolchain-x64
    family: ["c7i", "m7i"]
    cpu: [8, 16]
    # Pin to the larger 64 GB variant. ATA registers extra crates
    # (`codex-v8-poc`, `codex-elevenlabs`, `codex-realtime-webrtc`,
    # voice/audio_device modules, …) that push the `--all-features` MSVC
    # ci-test compile past the 32 GB ceiling and trigger
    # `memory allocation failed` from rustc/`DroplessArena::grow`.
    # 64 GB removes the OOM headroom problem.
    ram: [64]
    # On-demand instead of spot. Spot interruptions during the long
    # MSVC ci-test compile have repeatedly killed the runner mid-step
    # without recovery (the workload is 12+ minutes and `retry:
    # when-interrupted` only re-runs the entire job, multiplying cost).
    # ATA's compile takes longer than upstream codex-locus's because we
    # add `codex-v8-poc` (real impl), voice/audio_device, etc.
    spot: false
    retry: when-interrupted

  # --- Release (bigger for LTO, on-demand for reliability) ---
  release-linux-x64:
    image: ubuntu24-full-x64
    family: ["c7i", "c7a"]
    cpu: [8, 16]
    ram: [16, 32]
    spot: false

  release-linux-arm64:
    image: ubuntu24-full-arm64
    family: ["c7g", "m7g"]
    cpu: [8, 16]
    ram: [32, 64]
    spot: false

  release-windows-x64:
    image: windows25-vstoolchain-x64
    family: ["c7i", "m7i"]
    cpu: [8, 16]
    ram: [32, 64]
    spot: false
