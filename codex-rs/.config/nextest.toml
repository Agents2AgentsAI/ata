[profile.default]
# Keep slow-test reporting at 15s, but allow 60s before termination while CI
# remains noisy.
slow-timeout = { period = "15s", terminate-after = 4 }

[test-groups.app_server_protocol_codegen]
max-threads = 1

[test-groups.app_server_integration]
max-threads = 1

[test-groups.apply-patch-cli]
max-threads = 2

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1


[[profile.default.overrides]]
# Do not add new tests here
filter = 'test(rmcp_client) | test(humanlike_typing_1000_chars_appears_live_no_placeholder)'
slow-timeout = { period = "1m", terminate-after = 4 }

[[profile.default.overrides]]
# Approval matrix tests spawn many real subprocesses (sandbox, python3, etc.)
# and slow down significantly under full-suite load.
filter = 'test(approval_matrix_covers_group)'
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.default.overrides]]
# compact_resume_fork tests drive full compaction + rollout-replay + fork flows
# against a mock server; they're materially slower on contended Windows/arm64
# runners and occasionally need a couple of retries to absorb timing variance.
filter = 'package(codex-core) & test(/^suite::compact_resume_fork::/)'
slow-timeout = { period = "60s", terminate-after = 3 }
retries = 2

[[profile.default.overrides]]
# Generated-image rollback drives the image artifact path plus a second
# rollback/replay turn. On full ARM CI this can cross the default 60s ceiling
# before the mocked server responds, so give this exact integration test the
# same timing headroom as other rollout-replay cases.
filter = 'package(codex-core) & test(suite::model_switching::thread_rollback_after_generated_image_drops_entire_image_turn_history)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
# Nested rollout-resume tree tests are materially slower on Windows due to
# filesystem and thread startup overhead.
filter = 'test(resume_agent_from_rollout_reopens_open_descendants_after_manager_shutdown) | test(resume_agent_from_rollout_uses_edge_data_when_descendant_metadata_source_is_stale)'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# Agent control tree tests spawn many child threads/rollouts and run
# materially slower on Windows/arm64 under full-suite load.
filter = 'package(codex-core) & test(/^agent::control::tests::/)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
# Known flaky due to second-granularity timestamps and cwd-based session ordering.
filter = 'test(exec_resume_last_respects_cwd_filter_and_all_flag)'
retries = 2

[[profile.default.overrides]]
# CLI/exec integration tests spawn ata binary subprocesses which are slow under CI load.
filter = 'test(integration_creates_and_checks_session_file) | test(exec_resume)'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# zsh fork tests are slow on CI (spawn zsh subprocesses) and occasionally flaky.
filter = 'test(turn_start_shell_zsh_fork)'
slow-timeout = { period = "60s", terminate-after = 3 }
retries = 2

[[profile.default.overrides]]
# Preflight version check (500ms timeout) can be flaky under full-suite load,
# causing the test to observe an unexpected error type.
filter = 'test(spawn_client_prompts_install_on_preflight_needs_install_and_decline)'
retries = 2

[[profile.default.overrides]]
# Windows-specific proxy port assertions depend on static ports (43128/48081)
# being available on the runner, which is racy when other processes hold them.
filter = 'package(codex-network-proxy) & test(managed_proxy_builder_uses_loopback_ports)'
retries = 2

[[profile.default.overrides]]
# Unified-exec tests depend on terminal interaction timing and occasionally
# miss a delayed write_stdin event under CI load.
filter = 'package(codex-core) & test(/^suite::unified_exec::/)'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
filter = 'package(codex-app-server-protocol) & (test(typescript_schema_fixtures_match_generated) | test(json_schema_fixtures_match_generated) | test(generate_ts_with_experimental_api_retains_experimental_entries) | test(generated_ts_optional_nullable_fields_only_in_params) | test(generate_json_filters_experimental_fields_and_methods))'
test-group = 'app_server_protocol_codegen'

[[profile.default.overrides]]
# These integration tests spawn a fresh app-server subprocess per case.
# Keep the library unit tests parallel.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
filter = 'package(codex-core) and test(/suite::apply_patch_cli::/)'
test-group = 'apply-patch-cli'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# Exec-server tests exercise real subprocess timing (e.g. Windows `ping`
# delays, arm64 websocket startup) and are occasionally flaky on slower
# runners.
filter = 'package(codex-exec-server)'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
# compact_remote tests use `wait_for_event` with the upstream default 1s
# timeout. ATA's overlay registers ~8 extra tools and a larger system
# prompt, which on contended Linux x64 CI runners pushes
# initial-turn-complete past the 1s window. Retry to absorb that
# variance — the underlying logic is unchanged.
filter = 'package(codex-core) & test(/^suite::compact_remote::/)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
# WebRTC sideband close-race tests assert that an in-flight handshake aborts
# before the mock server records it. The race window is bounded by the
# accept_delay (≤1s) and is tight on slow arm64 runners (Graviton), where
# the abort occasionally loses to the handshake. Retry to absorb that.
filter = 'package(codex-core) & test(/^suite::realtime_conversation::conversation_webrtc_/)'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 2

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize them to avoid exhausting Windows session/global desktop resources in CI.
filter = 'package(codex-windows-sandbox) & test(legacy_)'
test-group = 'windows_sandbox_legacy_sessions'
