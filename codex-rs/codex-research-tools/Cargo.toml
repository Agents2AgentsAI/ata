[package]
name = "codex-research-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["paper_search", "zotero"]
paper_search = ["dep:quick-xml"]
zotero = ["dep:regex"]
repo_analysis = ["dep:regex", "dep:walkdir"]
latex = ["dep:flate2"]
pdf_images = []
hackernews = []
all = ["paper_search", "zotero", "repo_analysis", "latex", "pdf_images", "hackernews"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
dashmap = "6"
dirs = { workspace = true }
futures = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tempfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
urlencoding = { workspace = true }

flate2 = { version = "1", optional = true }
quick-xml = { version = "0.38.4", optional = true }
regex = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
