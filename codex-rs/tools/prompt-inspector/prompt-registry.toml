# Prompt Inspector Registry
#
# Manual registry for agent-facing content that lives as inline Rust strings.
# Auto-discovery via glob patterns cannot find these entries.
#
# Fields:
#   name        - display name (use the agent-facing tool name where applicable)
#   category    - "system-prompts" | "tool-descriptions" | "agent-messages" | "context-injection"
#   file        - path relative to codex-rs/
#   pattern     - const name or function name to look up in the file
#   type        - "function" if this is a function (omit for consts)
#   description - human-readable description of what this content does

# ---------------------------------------------------------------------------
# System prompts
# ---------------------------------------------------------------------------

[[entries]]
name        = "DEFAULT_PERSONALITY_HEADER"
category    = "system-prompts"
file        = "models-manager/src/model_info.rs"
pattern     = "DEFAULT_PERSONALITY_HEADER"
description = "Base personality header injected into all model system prompts"

[[entries]]
name        = "LOCAL_FRIENDLY_TEMPLATE"
category    = "system-prompts"
file        = "models-manager/src/model_info.rs"
pattern     = "LOCAL_FRIENDLY_TEMPLATE"
description = "Friendly personality template for local models"

[[entries]]
name        = "LOCAL_PRAGMATIC_TEMPLATE"
category    = "system-prompts"
file        = "models-manager/src/model_info.rs"
pattern     = "LOCAL_PRAGMATIC_TEMPLATE"
description = "Pragmatic personality template for local models"

