[package]
name = "codex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ata"
path = "src/main.rs"

[lib]
name = "codex_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
codex-app-server = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-app-server-test-client = { workspace = true }
codex-arg0 = { workspace = true }
codex-chatgpt = { workspace = true }
codex-cloud-tasks = { path = "../cloud-tasks" }
codex-utils-cli = { workspace = true }
codex-core = { workspace = true }
codex-exec = { workspace = true }
codex-research-tools = { workspace = true, optional = true }
codex-execpolicy = { workspace = true }
codex-login = { workspace = true }
codex-mcp-server = { workspace = true }
codex-protocol = { workspace = true }
codex-responses-api-proxy = { workspace = true }
codex-rmcp-client = { workspace = true }
codex-stdio-to-uds = { workspace = true }
codex-tui = { workspace = true }
libc = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde_json = { workspace = true }
supports-color = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
toml = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }

[features]
data = ["codex-core/data"]
kb = ["codex-core/kb"]
research-hackernews = ["codex-core/research-hackernews"]
research-latex = ["codex-core/research-latex"]
research-pdf-images = ["codex-core/research-pdf-images"]
research-patents = ["codex-core/research-patents"]
research-repo = ["codex-core/research-repo"]
visual-reports = ["codex-core/visual-reports"]
research-all = ["data", "kb", "research-hackernews", "research-latex", "research-patents", "research-pdf-images", "research-repo", "dep:codex-research-tools", "codex-research-tools/latex", "codex-research-tools/pdf_images"]

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
