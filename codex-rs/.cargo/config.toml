# Use the system `git` CLI for fetches instead of cargo's built-in libgit2
# client. libgit2 on macOS routes through SecureTransport, which has been
# consistently dropping connections to https://chromium.googlesource.com
# (the libwebrtc -> libyuv submodule pull) on GitHub-hosted x86_64 runners,
# stalling release builds for ~45 minutes per attempt before the retry
# script gives up. Cargo's own error message recommends this exact flag.
[net]
git-fetch-with-cli = true

# macOS aarch64 defaults Rust test threads to 2 MB which overflows several
# codex-app-server in_process and tracing tests. Linux defaults to 8 MB so
# upstream CI passes; bump to 16 MB for all platforms to keep parity.
[env]
RUST_MIN_STACK = "16777216"

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
